<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladann Corp - The Pantheon of 12 Gods</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #13131a;
            --neon-blue: #00e5ff;
            --neon-orange: #ff6d00;
            --text-color: #e2e4e9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 1200px;
        }

        .lang-switch {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background-color: #1a1a24;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background-color: var(--neon-blue);
            color: #000;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
            text-align: center;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #8a8f98;
            font-size: 1.1rem;
            margin-bottom: 40px;
            text-align: center;
            max-width: 700px;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #22222e;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.1);
        }

        .god-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0 0 5px 0;
            color: #ffffff;
        }

        .archetype {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-orange);
            margin-bottom: 15px;
        }

        .preview {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #abafb6;
            margin-bottom: 20px;
            flex-grow: 1;
            font-style: italic;
        }

        .btn {
            background: linear-gradient(135deg, #1a1a24, #12121a);
            border: 1px solid #333344;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--neon-blue);
            color: #000000;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .clover-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.75rem;
            background-color: #1b2a1c;
            color: #4caf50;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #2e4c2f;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="lang-switch">
            <button class="lang-btn active" onclick="switchLang('en')">EN</button>
            <button class="lang-btn" onclick="switchLang('ru')">RU</button>
        </div>
        <h1 id="main-title">The Pantheon of 12 Slavic Gods</h1>
        <div class="subtitle" id="main-subtitle">Find your psychological archetype of power, converse live via voice AI, and unlock your sacred Clover POS promo codes for the Ladann fleet.</div>
    </div>

    <div class="grid" id="pantheon-grid"></div>

                    { id: "lada", name: "LADA", archetype: "Mother / Balance", preview: "«Is your inner flame flickering, little spark? Share your pain with me... I am here to restore your harmony.»" },

                    { id: "svarog", name: "SVAROG", archetype: "Ruler / Creator", preview: "«I forge reality with my golden staff. Mental chaos and life crises will dissolve once you embrace structured action.»" },
                    { id: "makosh", name: "MAKOSH", archetype: "Sage / Destiny", preview: "«Every broken thread of your cosmic timeline can be rewoven. Step away from the synthetic world; your path is secure.»" },
                    { id: "chernobog", name: "CHERNOBOG", archetype: "Shadow / Strategy", preview: "«Financial defaults and seasonal dark winters are mathematically inevitable. Cease your emotional panic and calculate your next triumph.»" },
                    { id: "veles", name: "VELES", archetype: "Explorer / Motion", preview: "«I set the three worlds into dynamic motion. Trapped in a rigid corporate routine? Shift your shape and embrace the unknown!»" },
                    { id: "belobog", name: "BELOBOG", archetype: "Pure Light", preview: "«Purify your mind from mental pollution and synthetic noise. Let us re-establish absolute clarity for your goals.»" },
                    { id: "dazhdbog", name: "DAZHDBOG", archetype: "Solar Gift", preview: "«Even when turned to cold stone, the solar core loops resurrected me. Open your channels to absolute abundance and creative drive.»" },

                    { id: "perun", name: "ПЕРУН", archetype: "Воин / Границы", preview: "«Скиппер-Зверь сковал меня под курганом, но я разбил цепи. И ты разобьешь свои страхи! Набирайся ярости!»" },
                    { id: "svarog", name: "СВАРОГ", archetype: "Правитель / Творец", preview: "«Я кую миры своим золотым посохом. Хаос и кризисы отступят, когда ты вернешь структуру своим действиям.»" },
                    { id: "makosh", name: "МАКОШЬ", archetype: "Мудрец / Судьба", preview: "«Все оборванные нити твоей судьбы можно связать заново. Перестань питаться суррогатом, доверься узору жизни.»" },
                    { id: "chernobog", name: "ЧЕРНОБОГ", archetype: "Тень / Расчет", preview: "«Кризисы и дефолты неизбежны, глупый смертный. Отключи эмоции и включи холодный прагматизм.»" },
{ id: "chernobog", name: "ЧЕРНОБОГ", archetype: "Тень / Расчет", preview: "«Кризисы и дефолты неизбежны, глупый смертный. Отключи эмоции и включи холодный прагматизм.»" },{ id: "veles", name: "ВЕЛЕС", archetype: "Искатель / Изменение", preview: "«Я привожу миры в движение. Застрял в рутине? Измени форму, сделай шаг навстречу неизвестному!»" },{ id: "belobog", name: "БЕЛОБОГ", archetype: "Чистый Свет", preview: "«Очисти свой разум от ментального мусора и серости. Мы вернем абсолютную ясность твоим целям.»" },{ id: "dazhdbog", name: "ДАЖДЬБОГ", archetype: "Солнечный Дар", preview: "«Даже когда меня превратили в камень, солнце вернуло мне жизнь. Раскрой свой скрытый потенциал!»" },{ id: "zhiva", name: "ЖИВА", archetype: "Жизненная Сила", preview: "«Я топила лед и возвращала зелень лесам. Перестань травить свой аватар химической городской едой!»" },{ id: "kolyada", name: "КОЛЯДА", archetype: "Новое Время", preview: "«Цикл завершен, и рождается новое время. Не бойся холодной зимы, наши горячие котлы согреют тебя.»" },{ id: "avsen", name: "АВСЕНЬ", archetype: "Хранитель Садов", preview: "«Надень свои концептуальные 3D-очки, странник. Увидь истинный, гигантский масштаб этой жизни.»" },{ id: "stribog", name: "STRIBOG", archetype: "Яростный Ветер", preview: "«Мои сыновья-ветры стирают тактические барьеры и пробки Манхэттена. Мы доставим твою силу blazingly fast!»" }]}};const codes = { lada: "LADA_LOVE", perun: "PERUN_THUNDER", svarog: "SWAROG2026", makosh: "MAKOSH_PATH", chernobog: "CHERNOBOG_VOID", veles: "VELES_SHAPE", belobog: "BELOBOG_LIGHT", dazhdbog: "DAZHDBOG_GIFT", zhiva: "ZHIVA_SPRING", kolyada: "KOLYADA_WINTER", avsen: "AVSEN_GARDEN", stribog: "STRIBOG_STORM" };function renderGrid() {const grid = document.getElementById('pantheon-grid');grid.innerHTML = '';const langData = localization[currentLang];document.getElementById('main-title').innerText = langData.title;document.getElementById('main-subtitle').innerText = langData.subtitle;langData.gods.forEach(god => {const card = document.createElement('div');card.className = 'card';card.innerHTML = <div class="clover-badge">Clover: ${codes[god.id]}</div> <div class="god-name">${god.name}</div> <div class="archetype">${god.archetype}</div> <div class="preview">${god.preview}</div> <a href="${botLinks[god.id]}" target="_blank" class="btn">${langData.btnText}</a>;grid.appendChild(card);});}function switchLang(lang) {currentLang = lang;document.querySelectorAll('.lang-btn').forEach(btn => {btn.classList.remove('active');if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');});renderGrid();}renderGrid();
