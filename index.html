<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladann Corp - The Pantheon of 12 Gods</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #13131a;
            --neon-blue: #00e5ff;
            --neon-orange: #ff6d00;
            --text-color: #e2e4e9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 1200px;
        }
        .lang-switch {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .lang-btn {
            background-color: #1a1a24;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            background-color: var(--neon-blue);
            color: #000;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
            text-align: center;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #8a8f98;
            font-size: 1.1rem;
            margin-bottom: 40px;
            text-align: center;
            max-width: 700px;
            line-height: 1.5;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #22222e;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.1);
        }
        .god-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0 0 5px 0;
            color: #ffffff;
        }
        .archetype {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-orange);
            margin-bottom: 15px;
        }
        .preview {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #abafb6;
            margin-bottom: 20px;
            flex-grow: 1;
            font-style: italic;
        }
        .btn {
            background: linear-gradient(135deg, #1a1a24, #12121a);
            border: 1px solid #333344;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: var(--neon-blue);
            color: #000000;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .btn.btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .clover-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.75rem;
            background-color: #1b2a1c;
            color: #4caf50;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #2e4c2f;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .clover-badge:hover {
            background-color: #2e4c2f;
        }
        .clover-badge.copied {
            background-color: #00e5ff;
            color: #000;
            border-color: #00e5ff;
        }
    </style>
    <!-- FIX #1: this used to be <script src="https://coze.com"></script>, which is just the
         Coze homepage, not a JS file -- CozeWebSDK was never defined and the chat button was dead.
         Corrected to the real SDK URL from the official install snippet. -->
    <script src="https://sf-cdn.coze.com/obj/unpkg-va/flow-platform/chat-app-sdk/1.2.0-beta.6/libs/oversea/index.js"></script>
</head>
<body>
    <div class="header-container">
        <div class="lang-switch">
            <button class="lang-btn active" onclick="switchLang('en')" aria-label="Switch to English">EN</button>
            <button class="lang-btn" onclick="switchLang('ru')" aria-label="Переключить на русский">RU</button>
        </div>
        <h1 id="main-title">The Pantheon of 12 Slavic Gods</h1>
        <div class="subtitle" id="main-subtitle">Find your psychological archetype of power, converse live via voice AI, and unlock your sacred Clover codes for the Ladann fleet.</div>
    </div>
    <div class="grid" id="pantheon-grid"></div>
    <script>
        let currentLang = 'en';
        let cozeWebSDKInstance = null;
        let cozeInitFailed = false;

        const localization = {
            en: {
                title: "The Pantheon of 12 Slavic Gods",
                subtitle: "Find your psychological archetype of power, converse live via voice AI, and unlock your sacred Clover codes for the Ladann fleet.",
                btnText: "COMMUNE WITH ORACLE",
                copiedText: "Copied!",
                oracleUnavailable: "Oracle is temporarily unavailable. Please try again later.",
                gods: [
                    { id: "lada", name: "LADA", archetype: "Mother / Balance", preview: "I am here to restore your harmony, little spark." },
                    { id: "perun", name: "PERUN", archetype: "Warrior / Boundaries", preview: "Break your chains. Ignite your will!" },
                    { id: "svarog", name: "SVAROG", archetype: "Ruler / Creator", preview: "Mental chaos will dissolve once you embrace structured action." },
                    { id: "makosh", name: "MAKOSH", archetype: "Sage / Destiny", preview: "Every broken thread of your cosmic timeline can be rewoven." },
                    { id: "chernobog", name: "CHERNOBOG", archetype: "Shadow / Strategy", preview: "Cease your emotional panic and calculate your next triumph." },
                    { id: "veles", name: "VELES", archetype: "Explorer / Motion", preview: "Trapped in a rigid routine? Shift your shape and embrace the unknown!" },
                    { id: "morena", name: "MORENA", archetype: "Transformation / Letting Go", preview: "Do not fear the dark winter of life. Release what is dead to grow." },
                    { id: "dazhdbog", name: "DAZHDBOG", archetype: "Solar Gift", preview: "Open your channels to absolute abundance and creative drive." },
                    { id: "zhiva", name: "ZHIVA", archetype: "Vital Force", preview: "Stop poisoning your physical avatar with processed toxic fast food." },
                    { id: "kolyada", name: "KOLYADA", archetype: "New Era", preview: "The clock strikes midnight. Our mobile altars will protect you." },
                    { id: "avsen", name: "AVSEN", archetype: "Garden Keeper", preview: "Observe the true, giant-caliber harvest of your potential." },
                    { id: "stribog", name: "STRIBOG", archetype: "Raging Wind", preview: "My winds sweep away roadblocks. We deliver your fuel blazingly fast." }
                ]
            },
            ru: {
                title: "Пантеон 12 Славянских Богов",
                subtitle: "Найдите свой ментальный archetype силы, побеседуйте вживую голосом и заберите священный промокод для фудтраков Ladann.",
                btnText: "ПОГОВОРИТЬ С ОРАКУЛОМ",
                copiedText: "Скопировано!",
                oracleUnavailable: "Оракул временно недоступен. Попробуйте позже.",
                gods: [
                    { id: "lada", name: "ЛАДА", archetype: "Мать / Гармония", preview: "Твой внутренний огонёк дрожит? Восстановим лад в твоем сердце." },
                    { id: "perun", name: "ПЕРУН", archetype: "Воин / Границы", preview: "Скипетр сковал меня, но я разбил цепи. Разбей страхи!" },
                    { id: "svarog", name: "СВАРОГ", archetype: "Правитель / Творец", preview: "Хаос отступит, когда ты вернешь структуру действиям." },
                    { id: "makosh", name: "МАКОШЬ", archetype: "Мудрец / Судьба", preview: "Все оборванные нити твоей судьбы можно связать заново." },
                    { id: "chernobog", name: "ЧЕРНОБОГ", archetype: "Тень / Расчет", preview: "Кризисы неизбежны. Отключи эмоции и включи расчет." },
                    { id: "veles", name: "ВЕЛЕС", archetype: "Искатель / Изменение", preview: "Застрял в рутине? Сделай шаг навстречу неизвестному!" },
                    { id: "morena", name: "МОРЕНА", archetype: "Трансформация / Отпускание", preview: "Не бойся темной зимы. Отпусти то, что умерло, ради нового роста." },
                    { id: "dazhdbog", name: "ДАЖДЬБОГ", archetype: "Солнечный Дар", preview: "Солнце вернуло мне жизнь. Раскрой свой скрытый потенциал!" },
                    { id: "zhiva", name: "ЖИВА", archetype: "Жизненная Сила", preview: "Перестань травить свой аватар химической городской едой!" },
                    { id: "kolyada", name: "КОЛЯДА", archetype: "Новое Время", preview: "Цикл завершен. Не бойся зимы, наши котлы согреют тебя." },
                    { id: "avsen", name: "АВСЕНЬ", archetype: "Хранитель Садов", preview: "Надень свои 3D-очки. Увидь масштаб этой жизни." },
                    { id: "stribog", name: "СТРИБОГ", archetype: "Яростный Ветер", preview: "Мои ветры стирают пробки Манхэттена. Доставим силу blazingly fast!" }
                ]
            }
        };

        const codes = {
            lada: "LADA_LOVE", perun: "PERUN_THUNDER", svarog: "SWAROG2026", makosh: "MAKOSH_PATH",
            chernobog: "CHERNOBOG_VOID", veles: "VELES_SHAPE", morena: "MORENA_TRANSFORM", dazhdbog: "DAZHDBOG_GIFT",
            zhiva: "ZHIVA_SPRING", kolyada: "KOLYADA_WINTER", avsen: "AVSEN_GARDEN", stribog: "STRIBOG_STORM"
        };

        function copyToClipboard(text, badgeElement, lang) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = badgeElement.innerText;
                badgeElement.innerText = localization[lang].copiedText;
                badgeElement.classList.add('copied');
                setTimeout(() => {
                    badgeElement.innerText = originalText;
                    badgeElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('pantheon-grid');
            grid.innerHTML = '';
            const langData = localization[currentLang];
            document.getElementById('main-title').innerText = langData.title;
            document.getElementById('main-subtitle').innerText = langData.subtitle;

            langData.gods.forEach(god => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="clover-badge" title="Click to copy" onclick="copyToClipboard('${codes[god.id]}', this, '${currentLang}')">Clover: ${codes[god.id]}</div>
                    <div class="god-name">${god.name}</div>
                    <div class="archetype">${god.archetype}</div>
                    <div class="preview">"${god.preview}"</div>
                    <a href="#" onclick="openOracleChat(event)" class="btn${cozeInitFailed ? ' btn-disabled' : ''}">${langData.btnText}</a>
                `;
                grid.appendChild(card);
            });
        }

        // Activate the official Coze Chat SDK.
        //
        // FIX #2 (SECURITY): the original file hardcoded a real, live Personal Access Token
        // directly in this client-side script. Anyone who viewed the page source could copy it
        // and call the Coze API as you. That token should be treated as compromised -- rotate
        // it in your Coze dashboard, then paste the NEW token below. Do not commit or publish
        // a real PAT in client-side code; if possible, proxy the chat session through your own
        // backend instead so the token never reaches the browser at all.
        const COZE_PAT_TOKEN = 'PASTE_YOUR_NEW_ROTATED_TOKEN_HERE';

        function initCoze() {
            try {
                cozeWebSDKInstance = new CozeWebSDK.WebChatClient({
                    config: {
                        bot_id: '7686486765427490821',
                    },
                    componentProps: {
                        title: 'The Pantheon of 12 Gods',
                    },
                    auth: {
                        type: 'token',
                        token: COZE_PAT_TOKEN,
                        onRefreshToken: async () => COZE_PAT_TOKEN
                    },
                    ui: {
                        base: {
                            layout: 'mobile', /* NOTE: this forces the mobile widget layout on ALL
                                                  devices, including desktop. Confirm that's what you
                                                  want -- change to 'pc' or omit to let it adapt. */
                            lang: 'en',
                            zIndex: 999999
                        },
                        asstBtn: { isNeed: true },
                        footer: { isShow: false }
                    }
                });
            } catch (error) {
                console.error("Failed to initialize Coze SDK:", error);
                cozeInitFailed = true;
                renderGrid(); // re-render so buttons reflect the failed state
            }
        }

        function openOracleChat(e) {
            e.preventDefault();
            if (cozeWebSDKInstance) {
                cozeWebSDKInstance.openChat();
            } else {
                // FIX #4 (UX): previously this only logged a console warning, so a visitor
                // clicking the button with a broken/unloaded SDK saw nothing happen at all.
                console.warn("Coze SDK is not initialized yet.");
                alert(localization[currentLang].oracleUnavailable);
            }
        }

        function switchLang(lang) {
            currentLang = lang;
            // FIX #3 (accessibility): keep the <html lang="..."> attribute in sync so screen
            // readers announce the right language instead of always reading it as English.
            document.getElementById('html-root').setAttribute('lang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');
            });
            renderGrid();
        }

        initCoze();
        renderGrid();
    </script>
</body>
</html>
