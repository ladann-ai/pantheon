<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladann Corp - The Pantheon of 12 Gods</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #13131a;
            --neon-blue: #00e5ff;
            --neon-orange: #ff6d00;
            --text-color: #e2e4e9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 1200px;
        }
        .lang-switch {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .lang-btn {
            background-color: #1a1a24;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            background-color: var(--neon-blue);
            color: #000;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
            text-align: center;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #8a8f98;
            font-size: 1.1rem;
            margin-bottom: 40px;
            text-align: center;
            max-width: 700px;
            line-height: 1.5;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #22222e;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.1);
        }
        .god-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0 0 5px 0;
            color: #ffffff;
        }
        .archetype {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-orange);
            margin-bottom: 15px;
        }
        .preview {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #abafb6;
            margin-bottom: 20px;
            flex-grow: 1;
            font-style: italic;
        }
        .btn {
            background: linear-gradient(135deg, #1a1a24, #12121a);
            border: 1px solid #333344;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: var(--neon-blue);
            color: #000000;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .clover-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.75rem;
            background-color: #1b2a1c;
            color: #4caf50;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #2e4c2f;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="lang-switch">
            <button class="lang-btn active" onclick="switchLang('en')">EN</button>
            <button class="lang-btn" onclick="switchLang('ru')">RU</button>
        </div>
        <h1 id="main-title">The Pantheon of 12 Slavic Gods</h1>
        <div class="subtitle" id="main-subtitle">Find your psychological archetype of power, converse live via voice AI, and unlock your sacred Clover codes for the Ladann fleet.</div>
    </div>
    <div class="grid" id="pantheon-grid"></div>
    <script>
        let currentLang = 'en';
        const botLinks = {
            lada: "https://character.ai/chat/nbJ52Emy1tBXQFMyAWlfDoEjcCaRwjBzM77xNmrqFRY",
            perun: "https://character.ai", svarog: "https://character.ai", makosh: "https://character.ai",
            chernobog: "https://character.ai", veles: "https://character.ai", marena: "https://character.ai",
            dazhdbog: "https://character.ai", zhiva: "https://character.ai", kolyada: "https://character.ai",
            avsen: "https://character.ai", stribog: "https://character.ai"
        };
        const localization = {
            en: {
                title: "The Pantheon of 12 Slavic Gods",
                subtitle: "Find your psychological archetype of power, converse live via voice AI, and unlock your sacred Clover codes for the Ladann fleet.",
                btnText: "COMMUNE VIA VOICE / CALL",
                gods: [
                    { id: "lada", name: "LADA", archetype: "Mother / Balance", preview: "I am here to restore your harmony, little spark." },
                    { id: "perun", name: "PERUN", archetype: "Warrior / Boundaries", preview: "Break your chains. Ignite your will!" },
                    { id: "svarog", name: "SVAROG", archetype: "Ruler / Creator", preview: "Mental chaos will dissolve once you embrace structure." },
                    { id: "makosh", name: "MAKOSH", archetype: "Sage / Destiny", preview: "Every broken thread of your timeline can be rewoven." },
                    { id: "chernobog", name: "CHERNOBOG", archetype: "Shadow / Strategy", preview: "Cease your emotional panic and calculate your triumph." },
                    { id: "veles", name: "VELES", archetype: "Explorer / Motion", preview: "Trapped in a rigid routine? Shift your shape now!" },
                    { id: "marena", name: "MORENA", archetype: "Transformation / Letting Go", preview: "Do not fear the dark winter of life. Release what is dead to grow." },
                    { id: "dazhdbog", name: "DAZHDBOG", archetype: "Solar Gift", preview: "Open your channels to absolute abundance and drive." },
                    { id: "zhiva", name: "ZHIVA", archetype: "Vital Force", preview: "Stop poisoning your body with processed fast food." },
                    { id: "kolyada", name: "KOLYADA", archetype: "New Era", preview: "The clock strikes midnight. Our altars will protect you." },
                    { id: "avsen", name: "AVSEN", archetype: "Garden Keeper", preview: "Observe the true, giant-caliber harvest of your life." },
                    { id: "stribog", name: "STRIBOG", archetype: "Raging Wind", preview: "My winds sweep away roadblocks. We deliver your fuel blazingly fast." }
                ]
            },
            ru: {
                title: "Палата 12 Славянских Богов",
                subtitle: "Найдите свой ментальный archetype силы, побеседуйте вживую голосом и заберите священный промокод для фудтраков Ladann.",
                btnText: "ПОГОВОРИТЬ / ПОЗВОНИТЬ",
                gods: [
                    { id: "lada", name: "ЛАДА", archetype: "Мать / Гармония", preview: "Твой внутренний огонёк дрожит? Восстановим лад в твоем сердце." },
                    { id: "perun", name: "ПЕРУН", archetype: "Воин / Границы", preview: "Скиппер сковал меня, но я разбил цепи. Разбей страхи!" },
                    { id: "svarog", name: "СВАРОГ", archetype: "Правитель / Творец", preview: "Хаос отступит, когда ты вернешь структуру действиям." },
                    { id: "makosh", name: "МАКОШЬ", archetype: "Мудрец / Судьба", preview: "Все оборванные нити твоей судьбы можно связать заново." },
                    { id: "chernobog", name: "ЧЕРНОБОГ", archetype: "Тень / Расчет", preview: "Кризисы неизбежны. Отключи эмоции и включи расчет." },
                    { id: "veles", name: "ВЕЛЕС", archetype: "Искатель / Изменение", preview: "Застрял в рутине? Сделай шаг навстречу неизвестному!" },
                    { id: "marena", name: "МОРЕНА", archetype: "Трансформация / Отпускание", preview: "Не бойся темной зимы. Отпусти то, что умерло, ради нового роста." },
                    { id: "dazhdbog", name: "ДАЖДЬБОГ", archetype: "Солнечный Дар", preview: "Солнце вернуло мне жизнь. Раскрой свой скрытый потенциал!" },
                    { id: "zhiva", name: "ЖИВА", archetype: "Жизненная Сила", preview: "Перестань травить свой аватар химической городской едой!" },
                    { id: "kolyada", name: "КОЛЯДА", archetype: "Новое Время", preview: "Цикл завершен. Не бойся зимы, наши котлы согреют тебя." },
                    { id: "avsen", name: "АВСЕНЬ", archetype: "Хранитель Садов", preview: "Надень свои 3D-очки. Увидь масштаб этой жизни." },
                    { id: "stribog", name: "СТРИБОГ", archetype: "Яростный Ветер", preview: "Мои ветры стирают пробки Манхэттена. Доставим силу blazingly fast!" }
                ]
            }
        };
        const codes = {
            lada: "LADA_LOVE", perun: "PERUN_THUNDER", svarog: "SWAROG2026", makosh: "MAKOSH_PATH",
            chernobog: "CHERNOBOG_VOID", veles: "VELES_SHAPE", marena: "MORENA_TRANSFORM", dazhdbog: "DAZHDBOG_GIFT",
            zhiva: "ZHIVA_SPRING", kolyada: "KOLYADA_WINTER", avsen: "AVSEN_GARDEN", stribog: "STRIBOG_STORM"
        };
        function renderGrid() {
            const grid = document.getElementById('pantheon-grid');
            grid.innerHTML = '';
            const langData = localization[currentLang];
            document.getElementById('main-title').innerText = langData.title;
            document.getElementById('main-subtitle').innerText = langData.subtitle;
            langData.gods.forEach(god => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="clover-badge">Clover: ${codes[god.id]}</div>
                    <div class="god-name">${god.name}</div>
                    <div class="archetype">${god.archetype}</div>
                    <div class="preview">"${god.preview}"</div>
                    <a href="${botLinks[god.id]}" target="_blank" class="btn">${langData.btnText}</a>
                `;
                grid.appendChild(card);
            });
        }
        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');
            });
            renderGrid();
        }
        renderGrid();
    </script>
</body>
</html>
