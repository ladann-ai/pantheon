<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladann Corp - The Pantheon of 12 Gods</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #13131a;
            --neon-blue: #00e5ff;
            --neon-orange: #ff6d00;
            --text-color: #e2e4e9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 1200px;
        }
        .lang-switch {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .lang-btn {
            background-color: #1a1a24;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            background-color: var(--neon-blue);
            color: #000;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
            text-align: center;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #8a8f98;
            font-size: 1.1rem;
            margin-bottom: 40px;
            text-align: center;
            max-width: 700px;
            line-height: 1.5;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #22222e;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.1);
        }
        .god-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0 0 5px 0;
            color: #ffffff;
        }
        .archetype {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-orange);
            margin-bottom: 15px;
        }
        .preview {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #abafb6;
            margin-bottom: 20px;
            flex-grow: 1;
            font-style: italic;
        }
        .btn {
            background: linear-gradient(135deg, #1a1a24, #12121a);
            border: 1px solid #333344;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: var(--neon-blue);
            color: #000000;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .clover-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.75rem;
            background-color: #1b2a1c;
            color: #4caf50;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #2e4c2f;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .clover-badge:hover {
            background-color: #2e4c2f;
        }
        .clover-badge.copied {
            background-color: #00e5ff;
            color: #000;
            border-color: #00e5ff;
        }
    </style>
    <!-- Подключаем ОФИЦИАЛЬНЫЙ СТАБИЛЬНЫЙ PRODUCTION WEB SDK скрипт Coze -->
    <script src="https://coze.com"></script>
</head>
<body>
    <div class="header-container">
        <div class="lang-switch">
            <button class="lang-btn active" onclick="switchLang('en')" aria-label="Switch to English">EN</button>
            <button class="lang-btn" onclick="switchLang('ru')" aria-label="Переключить на русский">RU</button>
        </div>
        <h1 id="main-title">The Pantheon: 12 Neural Cognitive Architectures</h1>
        <div class="subtitle" id="main-subtitle">Find your deep psychological archetype of power, converse live via automated real-time Voice AI, and unlock your proprietary Clover codes.</div>
    </div>
    <div class="grid" id="pantheon-grid"></div>
    <script>
        let currentLang = 'en';
        let cozeWebSDKInstance = null;

        const localization = {
            en: {
                title: "The Pantheon: 12 Neural Cognitive Architectures",
                subtitle: "Find your deep psychological archetype of power, converse live via automated real-time Voice AI, and unlock your proprietary Clover codes.",
                btnText: "COMMUNE WITH ORACLE",
                copiedText: "Copied!",
                gods: [
                    { id: "lada", name: "LADA", archetype: "Systemic Balance & Harmony", preview: "I am here to restore your neuro-cognitive harmony, neural spark." },
                    { id: "perun", name: "PERUN", archetype: "Executive Boundaries & Drive", preview: "Disrupt your psychological stagnation. Galvanize your executive will." },
                    { id: "svarog", name: "SVAROG", archetype: "Structural Order & Focus", preview: "Subconscious chaos dissolves completely once you deploy structured action." },
                    { id: "makosh", name: "MAKOSH", archetype: "Strategic Vision & Timeline Rewriting", preview: "Every fractured thread of your neural timeline can be structurally rewoven." },
                    { id: "chernobog", name: "CHERNOBOG", archetype: "Shadow Integration & High-Stakes Logic", preview: "Deconstruct emotional panic. Coldly calculate your next strategic triumph." },
                    { id: "veles", name: "VELES", archetype: "Cognitive Agility & Market Survival", preview: "Bypassing linear constraints. Shift your operational matrix and exploit the unknown." },
                    { id: "morena", name: "MORENA", archetype: "Dynamic Disruption & Asset Clearance", preview: "Do not fear structural winters. Actively terminate what is obsolete to scale." },
                    { id: "dazhdbog", name: "DAZHDBOG", archetype: "Resource Abundance & Ideation Flow", preview: "Align your subconscious channels with absolute resource generation and creative focus." },
                    { id: "zhiva", name: "ZHIVA", archetype: "Biological Longevity & Cell Regeneration", preview: "Optimize your physical avatar. Terminate toxic environmental inputs right now." },
                    { id: "kolyada", name: "KOLYADA", archetype: "Macro Evolution & Mobile Safety", preview: "The legacy epoch begins. Our decentralized network units will defend your environment." },
                    { id: "avsen", name: "AVSEN", archetype: "Scaled Yield & Performance Analytics", preview: "Analyze the true, maximum-caliber output of your cognitive potential." },
                    { id: "stribog", name: "STRIBOG", archetype: "Velocity Optimization & Logistics", preview: "My protocols sweep away systemic roadblocks. We execute corporate delivery at lightspeed." }
                ]
            },
            ru: {
                title: "Пантеон: 12 Нейро-Когнитивных Архитектур",
                subtitle: "Найдите свой глубинный психологический архетип силы, побеседуйте вживую с автоматизированным голосовым ИИ и разблокируйте проприетарные коды Clover.",
                btnText: "ПОГОВОРИТЬ С ОРАКУЛОМ",
                copiedText: "Скопировано!",
                gods: [
                    { id: "lada", name: "ЛАДА", archetype: "Системный Баланс и Гармония", preview: "Я здесь, чтобы восстановить твою нейрокогнитивную гармонию, нейронная искра." },
                    { id: "perun", name: "ПЕРУН", archetype: "Стратегические Границы и Драйв", preview: "Разрушь психологический застой. Гальванизируй свою исполнительную волю." },
                    { id: "svarog", name: "СВАРОГ", archetype: "Структурный Порядок и Фокус", preview: "Подсознательный хаос полностью растворится, как только ты развернешь структурированные действия." },
                    { id: "makosh", name: "МАКОШЬ", archetype: "Стратегическое Видение и Пересборка Времени", preview: "Каждая оборванная нить твоей нейронной временной шкалы может быть структурно пересобрана." },
                    { id: "chernobog", name: "ЧЕРНОБОГ", archetype: "Интеграция Тени и Высокие Ставки", preview: "Деконструируй эмоциональную панику. Хладнокровно рассчитай свой следующий стратегический триумф." },
                    { id: "veles", name: "ВЕЛЕС", archetype: "Когнитивная Гибкость и Выживание на Рынке", preview: "Обходи линейные ограничения. Смести свою операционную матрицу и используй неизвестность." },
                    { id: "morena", name: "МОРЕНА", archetype: "Динамическая Деструкция и Очистка Активов", preview: "Не бойся структурной зимы. Активно ликвидируй то, что устарело, ради масштабирования." },
                    { id: "dazhdbog", name: "ДАЖДЬБОГ", archetype: "Поток Идей и Изобилие Ресурсов", preview: "Направь свои подсознательные каналы на абсолютную генерацию ресурсов и созидательный фокус." },
                    { id: "zhiva", name: "ЖИВА", archetype: "Биологическое Долголетие и Регенерация", preview: "Оптимизируй свой физический аватар. Прекрати любые токсичные внешние воздействия прямо сейчас." },
                    { id: "kolyada", name: "КОЛЯДА", archetype: "Макроэволюция и Мобильная Безопасность", preview: "Эпоха наследия начинается. Наши децентрализованные сетевые узлы защитят твою среду." },
                    { id: "avsen", name: "АВСЕНЬ", archetype: "Масштабируемая Эффективность и Аналитика", preview: "Проанализируй истинный, максимальный объем потенциала твоей когнитивной производительности." },
                    { id: "stribog", name: "СТРИБОГ", archetype: "Оптимизация Скорости и Логистика", preview: "Мои протоколы стирают системные преграды. Мы реализуем корпоративную доставку на сверхскорости." }
                ]
            }
        };

        const codes = {
            lada: "LADA_LOVE", perun: "PERUN_THUNDER", svarog: "SWAROG2026", makosh: "MAKOSH_PATH",
            chernobog: "CHERNOBOG_VOID", veles: "VELES_SHAPE", morena: "MORENA_TRANSFORM", dazhdbog: "DAZHDBOG_GIFT",
            zhiva: "ZHIVA_SPRING", kolyada: "KOLYADA_WINTER", avsen: "AVSEN_GARDEN", stribog: "STRIBOG_STORM"
        };

        function copyToClipboard(text, badgeElement, lang) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = badgeElement.innerText;
                badgeElement.innerText = localization[lang].copiedText;
                badgeElement.classList.add('copied');
                setTimeout(() => {
                    badgeElement.innerText = originalText;
                    badgeElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('pantheon-grid');
            grid.innerHTML = '';
            const langData = localization[currentLang];
            document.getElementById('main-title').innerText = langData.title;
            document.getElementById('main-subtitle').innerText = langData.subtitle;
            
            langData.gods.forEach(god => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="clover-badge" title="Click to copy" onclick="copyToClipboard('${codes[god.id]}', this, '${currentLang}')">Clover: ${codes[god.id]}</div>
                    <div class="god-name">${god.name}</div>
                    <div class="archetype">${god.archetype}</div>
                    <div class="preview">"${god.preview}"</div>
                    <a href="#" onclick="openOracleChat(event)" class="btn">${langData.btnText}</a>
                `;
                grid.appendChild(card);
            });
        }

        // Железобетонная инициализация стабильного Production SDK
        function initCoze() {
            try {
                cozeWebSDKInstance = new CozeWebSDK.WebChatClient({
                    config: {
                        bot_id: '7686486765427490821',
                    },
                    componentProps: {
                        title: 'The Pantheon of 12 Gods',
                    },
                    auth: {
                        type: 'token',
                        token: 'pat_7i9erpJRXt2fwjomoqinvikPU822j9Hp7vlWLyaOCzPYV0AUTMKccC9p4xC8meRq', 
                        onRefreshToken: async () => 'pat_7i9erpJRXt2fwjomoqinvikPU822j9Hp7vlWLyaOCzPYV0AUTMKccC9p4xC8meRq'
                    },
                    ui: {
                        base: { 
                            layout: 'mobile', 
                            lang: 'en', 
                            zIndex: 999999 
                        },
                        asstBtn: { isNeed: false }, /* Полностью убираем дублирующую кнопку сбоку */
                        footer: { isShow: false }
                    }
                });
            } catch (error) {
                console.error("Failed to initialize Coze SDK:", error);
            }
        }

        function openOracleChat(e) {
            e.preventDefault();
            if (cozeWebSDKInstance) {
                // Официальный рабочий вызов стабильного виджета
                cozeWebSDKInstance.openChat();
            } else {
                console.warn("Coze SDK is not initialized yet.");
            }
        }

        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');
            });
            renderGrid();
        }

        // Стартуем
        initCoze();
        renderGrid();
    </script>
</body>
</html>
